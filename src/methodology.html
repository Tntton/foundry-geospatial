<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Methodology · Foundry Intelligence Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css?v=rr15" />
    <style>
        .app-header {
            display: flex !important;
        }

        #login-btn, #logout-btn {
            display: none !important;
        }

        /* Override app shell overflow so the methodology page can scroll */
        .app {
            height: auto !important;
            overflow: visible !important;
        }

        .app-main {
            overflow: visible !important;
            height: auto !important;
        }

        /* .meth-wrapper is a direct grid child of .app.
           In a grid context, width:auto uses max-content sizing (not stretch),
           so we must set width:100% explicitly to constrain it to the grid
           column (= viewport width). min-width:0 prevents content from
           overflowing the column. */
        .meth-wrapper {
            width: 100%;
            min-width: 0;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: white;
            font-family: Helvetica, Arial, sans-serif;
            color: #000;
            margin: 0;
            overflow-y: auto !important;
        }

        .meth-wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        /* Breadcrumb */
        .meth-breadcrumb {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 24px;
            text-align: center;
        }

        .meth-breadcrumb a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .meth-breadcrumb a:hover {
            color: #666;
        }

        .meth-breadcrumb-sep {
            margin: 0 12px;
            color: #ccc;
        }

        .meth-breadcrumb-market {
            color: #666;
            font-weight: 600;
        }

        .meth-breadcrumb-market:hover {
            color: #333;
        }

        .meth-breadcrumb-region {
            color: #000;
            font-weight: 700;
        }

        /* Title */
        .meth-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 48px;
            color: #000;
            line-height: 1.2;
            text-align: center;
        }

        /* Tab switcher */
        .meth-tabs-wrapper {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 32px;
            padding: 0 0 0 0;
        }

        .meth-tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            background: white;
        }

        .meth-tab:hover {
            color: #666;
        }

        .meth-tab.active {
            color: #000;
            border-bottom-color: #000;
        }

        .meth-score-section {
            display: none;
        }

        .meth-score-section.active {
            display: block;
        }

        /* Coverage inline strip — the replacement for the matrix grid */
        .meth-coverage-wrapper {
            margin-bottom: 0;
        }

        .meth-coverage-grid {
            display: flex;
            align-items: stretch;
            gap: 0;
            border: 1px solid #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0;
        }

        .meth-coverage-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 6px;
            padding: 11px 14px;
            border-right: 1px solid #e5e5e5;
            background: #fff;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .meth-coverage-item:hover {
            background: #f9f9f9;
        }

        .meth-coverage-item.active {
            background: #f5f5f5;
            border-bottom: 3px solid #000;
        }

        .meth-coverage-item:last-child {
            border-right: none;
        }

        .meth-coverage-item.dim {
            background: #fafafa;
        }

        .meth-coverage-item.dim.active {
            background: #f0f0f0;
        }

        .meth-coverage-measure-name {
            font-size: 11px;
            font-weight: 600;
            color: #333;
        }

        .meth-coverage-measure-state {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #6e9277;
        }

        .meth-coverage-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .meth-coverage-dot.full {
            background: #6e9277;
        }

        .meth-coverage-dot.partial {
            background: #b07a00;
        }

        .meth-coverage-dot.notscored {
            background: #999;
        }

        .meth-coverage-measure-state.partial {
            color: #b07a00;
        }

        .meth-coverage-measure-state.notscored {
            color: #999;
        }

        /* Coverage summary / tally */
        .meth-coverage-tally {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #e5e5e5;
            margin-top: 0;
            text-align: left;
        }

        .meth-coverage-tally-dot {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .meth-coverage-tally-dot span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .meth-coverage-tally-dot b {
            color: #000;
            font-weight: 700;
        }

        .meth-coverage-note {
            margin-left: auto;
            color: #999;
            font-size: 12px;
        }

        /* Score section */
        .meth-score {
            border-top: 1px solid #eee;
            padding: 48px 0;
        }

        .meth-score:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .meth-score-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .meth-score-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .meth-score-num {
            font-size: 12px;
            font-weight: 600;
            color: #999;
        }

        .meth-score-title {
            font-size: 18px;
            font-weight: 700;
            color: #000;
        }

        .meth-coverage-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: #e9f0eb;
            color: #465e4d;
        }

        .meth-coverage-badge.partial {
            background: #fbf3de;
            color: #b07a00;
        }

        .meth-coverage-badge.notscored {
            background: #f5f5f5;
            color: #999;
        }

        .meth-score-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .meth-score-value {
            font-size: 48px;
            font-weight: 700;
            color: #000;
            line-height: 1;
        }

        .meth-score-unit {
            font-size: 12px;
            color: #999;
        }

        .meth-score-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Score section */
        .meth-score {
            padding: 28px 0;
        }

        .meth-score-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }

        .meth-score-title {
            font-size: 22px;
            font-weight: 700;
        }

        .meth-score-value-wrap {
            margin-left: auto;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .meth-score-value {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .meth-score-unit {
            font-size: 13px;
            color: #999;
        }

        .meth-score-value-notscored {
            font-size: 20px;
            font-weight: 600;
            color: #999;
        }

        .meth-score-desc {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .meth-score-why {
            font-size: 13px;
            color: #999;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* Formula callout */
        .meth-formula {
            border-left: 3px solid #e0e0e0;
            padding: 12px 16px;
            margin: 16px 0 20px;
            background: #fafafa;
        }

        .meth-formula-eyebrow {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 6px;
        }

        .meth-formula-text {
            font-size: 14px;
            font-weight: 700;
            color: #000;
        }

        /* Worked example 5-column table */
        .meth-worked-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 8px;
        }

        .meth-worked-example {
            margin-top: 4px;
        }

        .meth-worked-example table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .meth-worked-example thead td {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #999;
            padding: 0 0 10px;
            border-bottom: 1px solid #ddd;
        }

        .meth-worked-example thead td.r { text-align: right; }

        .meth-worked-example tbody td {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-variant-numeric: tabular-nums;
        }

        .meth-worked-example tbody td.r { text-align: right; }

        .meth-worked-example tbody tr.gone td {
            color: #bbb;
        }

        .meth-worked-example tbody tr.gone .meth-input-name {
            text-decoration: line-through;
            font-weight: 400;
        }

        .meth-worked-example tbody tr.gone .miss {
            font-size: 11px;
            color: #b07a00;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-decoration: none;
        }

        .meth-worked-example tr.rescale td {
            border-bottom: 1px dashed #ddd;
            font-style: italic;
            color: #999;
            font-size: 12px;
            padding: 8px 0;
        }

        .meth-worked-example tr.rescale td.r { text-align: right; }

        .meth-worked-example tr.total td {
            border-bottom: none;
            border-top: 1.5px solid #000;
            font-weight: 700;
            padding-top: 12px;
        }

        .meth-worked-example tr.pillar-header td {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #aaa;
            padding: 12px 0 4px;
            border-bottom: none;
        }

        .meth-worked-example tr.pillar-header:first-child td {
            padding-top: 4px;
        }

        .meth-worked-example tr.total td.label {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: #999;
            font-weight: 700;
        }

        .meth-worked-example tr.total td.r { text-align: right; }

        .meth-input-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 8px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .meth-input-name {
            font-weight: 600;
        }

        .meth-input-source {
            font-size: 10px;
            color: #aaa;
            font-weight: 400;
            margin-top: 2px;
            padding-left: 18px;
        }

        /* Confidence badge */
        .meth-confidence {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
        }

        .meth-confidence-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1.5px solid #b07a00;
            color: #b07a00;
        }

        .meth-confidence-badge .d {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b07a00;
        }

        .meth-confidence-note {
            font-size: 12px;
            color: #999;
            font-style: italic;
        }

        /* Method (non-score) layout */
        .meth-method {
            padding: 28px 0;
        }

        .meth-method-desc {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            margin: 8px 0 24px;
        }

        .meth-method-section {
            margin-bottom: 28px;
        }

        .meth-method-section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 12px;
        }

        /* Dimension cards (Archetype) */
        .meth-dimensions {
            display: flex;
            flex-direction: column;
            gap: 0;
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .meth-dimension-row {
            display: grid;
            grid-template-columns: 140px 1fr 2fr;
            gap: 0;
            border-bottom: 1px solid #eee;
        }

        .meth-dimension-row:last-child { border-bottom: none; }

        .meth-dimension-label {
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            background: #fafafa;
            border-right: 1px solid #eee;
        }

        .meth-dimension-values {
            padding: 14px 16px;
            border-right: 1px solid #eee;
        }

        .meth-dimension-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            background: #f0f0f0;
            border-radius: 2px;
            padding: 2px 7px;
            margin: 2px 3px 2px 0;
            color: #333;
        }

        .meth-dimension-how {
            padding: 14px 16px;
            font-size: 12px;
            color: #666;
            line-height: 1.55;
        }

        /* Steps list (FTE, Catchment) */
        .meth-steps {
            display: flex;
            flex-direction: column;
            gap: 0;
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .meth-step-row {
            display: grid;
            grid-template-columns: 36px 160px 1fr;
            gap: 0;
            border-bottom: 1px solid #eee;
            align-items: stretch;
        }

        .meth-step-row:last-child { border-bottom: none; }

        .meth-step-num {
            padding: 14px 0 14px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #bbb;
        }

        .meth-step-label {
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            border-right: 1px solid #eee;
            background: #fafafa;
        }

        .meth-step-detail {
            padding: 14px 16px;
            font-size: 12px;
            color: #666;
            line-height: 1.55;
        }

        /* Not scored block */
        .meth-notscored-block {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-top: 16px;
            padding: 14px 16px;
            background: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 3px;
            max-width: 640px;
        }

        .meth-notscored-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ececec;
            color: #999;
            display: grid;
            place-items: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .meth-notscored-text {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        .meth-notscored-unlock {
            color: #6e9277;
            font-weight: 700;
        }

        /* Result row */
        .meth-result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-top: 1px solid #eee;
            font-size: 12px;
            font-weight: 600;
        }

        .meth-result-label {
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .meth-result-value {
            font-size: 20px;
            color: #000;
            font-weight: 700;
        }

        /* Not scored */
        .meth-notscored-block {
            background: #f5f5f5;
            border-left: 3px solid #ccc;
            padding: 20px;
            border-radius: 3px;
            margin-top: 20px;
        }

        .meth-notscored-title {
            font-weight: 600;
            color: #666;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .meth-notscored-desc {
            font-size: 12px;
            color: #999;
            line-height: 1.5;
        }

        .meth-score-value-notscored {
            font-size: 32px;
            font-weight: 700;
            color: #ccc;
            text-align: right;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .meth-wrapper {
                padding: 32px 18px 56px;
            }

            .meth-title {
                font-size: 23px;
                line-height: 1.2;
                margin-bottom: 24px;
            }

            /* Header: drop the data-vintage chip so the pill + Login fit */
            .app-header .action-meta { display: none; }

            /* Score-measure tabs → compact single-line chips that scroll across. */
            .meth-coverage-grid {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                gap: 0;
                padding: 0;
            }
            .meth-coverage-grid::-webkit-scrollbar { display: none; }
            .meth-coverage-item {
                flex: 0 0 auto;
                flex-direction: row;
                align-items: center;
                gap: 7px;
                padding: 9px 15px;
                min-width: 0;
            }
            .meth-coverage-item.active { border-bottom-width: 2px; }
            .meth-coverage-measure-name { white-space: nowrap; font-size: 12px; }
            .meth-coverage-measure-state { gap: 0; font-size: 0; }
            .meth-coverage-dot { width: 8px; height: 8px; }

            /* Coverage tally */
            .meth-coverage-tally {
                flex-wrap: nowrap;
                gap: 16px;
                font-size: 12px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .meth-coverage-tally::-webkit-scrollbar { display: none; }
            .meth-coverage-tally > span:not(.meth-coverage-tally-dot) { display: none; }
            .meth-coverage-tally-dot { white-space: nowrap; flex-shrink: 0; }

            .meth-score-value { font-size: 34px; }
            .meth-score-value-notscored { font-size: 22px; }

            /* Table scrolls horizontally within its container */
            .meth-worked-example {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                max-width: 100%;
                width: 100%;
            }
            .meth-worked-example table { min-width: 520px; }
            .meth-worked-example th:first-child,
            .meth-worked-example td:first-child { min-width: 130px; }
        }

        @media (max-width: 520px) {
            .app-header { padding: 0 14px; }
            .brand-wordmark { display: none; }
            .app-header .brand-divider { display: none; }
            .meth-wrapper { padding: 20px 14px 56px; }
            .meth-title { font-size: 20px; }
            .meth-score-value { font-size: 30px; }
            .meth-coverage-item { min-width: 104px; }
            .meth-worked-example thead td,
            .meth-worked-example tbody td { font-size: 11px; }
            /* Gap between FH logo and market pill once brand-divider is hidden */
            .market-switcher-wrapper { margin-left: 12px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Header -->
    <header class="app-header">
        <a class="brand" href="map.html" style="text-decoration:none;color:inherit;cursor:pointer;flex-shrink:0;">
            <span class="brand-mark">FH</span>
            <span class="brand-divider"></span>
            <span class="brand-wordmark">FOUNDRY HEALTH</span>
        </a>

        <span class="brand-divider" style="margin: 0 20px;"></span>

        <a class="market-switcher-wrapper" id="market-switcher-wrapper" href="map.html" style="flex-shrink:0; text-decoration:none;">
            <div class="market-switcher-pill" id="market-selector-btn">
                <span class="market-switcher-ab" id="market-selector-label">GP</span>
                <span class="market-switcher-tx">
                    <span class="market-switcher-eyebrow">MARKET</span>
                    <span class="market-switcher-name" id="market-switcher-name">General Practice</span>
                </span>
            </div>
        </a>

        <div style="flex:1;"></div>

        <div class="actions">
            <span class="action-meta">Data vintage · Mar 2025</span>
            <button id="login-btn" class="nav-btn login">Login</button>
            <button id="logout-btn" class="nav-btn logout" style="display: none;">Logout</button>
        </div>
    </header>

    <!-- Main content -->
    <div class="meth-wrapper">
        <!-- Breadcrumb -->
        <div class="meth-breadcrumb">
            HOW WE SCORE
            <span class="meth-breadcrumb-sep"></span>
            <span class="meth-breadcrumb-market" id="meth-breadcrumb-market">GP</span>
            <span class="meth-breadcrumb-sep"></span>
            <span class="meth-breadcrumb-region">WYNDHAM</span>
        </div>

        <!-- Title -->
        <h1 class="meth-title">
            How Wyndham gets its <span id="meth-title-market">General Practice</span> scores
        </h1>

        <!-- Coverage -->
        <div class="meth-coverage-wrapper">
            <div class="meth-coverage-grid" id="meth-coverage-grid">
                <!-- Generated by JS -->
            </div>

            <div class="meth-coverage-tally" id="meth-coverage-tally">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Scores -->
        <div id="meth-scores">
            <!-- Generated by JS -->
        </div>
    </div>
</div>

<script>
    const marketData = {
        gp: {
            name: 'General Practice',
            shortName: 'GP',
            measures: [
                { id: 'composite', name: 'Composite', state: 'full' },
                { id: 'workforce', name: 'Workforce', state: 'full' },

    function render() {
        const marketParam = new URLSearchParams(window.location.search).get('market') || 'gp';
        const market = marketData[marketParam];

        if (!market) {
            document.body.innerHTML = '<p>Market not found</p>';
            return;
        }

        // Update breadcrumb and title
        document.getElementById('meth-breadcrumb-market').textContent = market.shortName.toUpperCase();
        document.getElementById('meth-title-market').textContent = market.name;
        document.getElementById('market-selector-label').textContent = market.shortName.substring(0, 3).toUpperCase();
        document.getElementById('market-switcher-name').textContent = market.name;

        // Update market switcher link to go to maps with market param
        document.getElementById('market-switcher-wrapper').href = `map.html?market=${marketParam}`;

        // Coverage grid - cells are clickable tabs
        const coverageByState = { full: 0, partial: 0, notscored: 0 };
        const gridHtml = market.measures.map((m, idx) => {
            coverageByState[m.state]++;
            const dimClass = m.state === 'notscored' ? ' dim' : '';
            const activeClass = idx === 0 ? ' active' : '';
            return `
                <div class="meth-coverage-item${dimClass}${activeClass}" data-measure="${m.id}" onclick="window.switchMeasure('${m.id}')">
                    <div class="meth-coverage-measure-name">${m.name}</div>
                    <div class="meth-coverage-measure-state ${m.state}">
                        <span class="meth-coverage-dot ${m.state}"></span>
                        ${m.state === 'full' ? 'Full' : m.state === 'partial' ? 'Partial' : 'Not scored'}
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('meth-coverage-grid').innerHTML = gridHtml;

        const tallyHtml = `
            <span>Data coverage for this market:</span>
            <span class="meth-coverage-tally-dot"><span style="background:#6e9277;"></span><b>${coverageByState.full}</b> Full</span>
            <span class="meth-coverage-tally-dot"><span style="background:#b07a00;"></span><b>${coverageByState.partial}</b> Partial</span>
            <span class="meth-coverage-tally-dot"><span style="background:#999;"></span><b>${coverageByState.notscored}</b> Not scored</span>
        `;
        document.getElementById('meth-coverage-tally').innerHTML = tallyHtml;

        // Scores - wrap each measure's score in a section
        const scoresContainer = document.getElementById('meth-scores');
        scoresContainer.innerHTML = '';

        market.measures.forEach((measure, idx) => {
            const scoreData = market.scoresByMeasure[measure.id];
            const sectionHtml = renderMeasureSection(measure, scoreData, market);
            scoresContainer.innerHTML += sectionHtml;
        });

        // Show first measure by default
        if (market.measures.length > 0) {
            window.switchMeasure(market.measures[0].id);
        }
    }

    function renderMeasureSection(measure, scoreData, market) {
        if (!scoreData) {
            return `<div class="meth-score-section" data-measure="${measure.id}"><p style="color:#999;padding:28px 0;">No methodology data yet for ${measure.name}.</p></div>`;
        }

        const inner = scoreData.method ? renderMethod(scoreData, market) : renderScore(scoreData, market);
        return `<div class="meth-score-section" data-measure="${measure.id}">${inner}</div>`;
    }

    function renderMethod(data, market) {
        // Coverage badge
        const isNotScored = data.state === 'notscored';
        const badgeClass = isNotScored ? 'b-none' : 'b-full';
        const badgeLabel = isNotScored
            ? `NOT SCORED · ${data.coverage?.pct ?? 0}% CLASSIFIED`
            : `FULL · ${data.coverage?.pct ?? 100}% CLASSIFIED`;

        // If not scored, show a held-back block instead of the method table
        const notScoredBlock = isNotScored ? `
            <div class="meth-notscored-block">
                <div class="meth-notscored-icon">○</div>
                <div class="meth-notscored-text">
                    <strong>Not yet available for this market.</strong> ${data.coverage?.note ?? ''}
                    <br><span class="meth-notscored-unlock">The method below describes how it works once data is ingested.</span>
                </div>
            </div>` : '';

        let bodyHtml = '';

        if (data.dimensions) {
            const rows = data.dimensions.map(d => `
                <div class="meth-dimension-row">
                    <div class="meth-dimension-label">${d.label}</div>
                    <div class="meth-dimension-values">${d.values.map(v => `<span class="meth-dimension-tag">${v}</span>`).join('')}</div>
                    <div class="meth-dimension-how">${d.how}</div>
                </div>`).join('');
            bodyHtml = `
                <div class="meth-method-section">
                    <div class="meth-method-section-label">DIMENSIONS</div>
                    <div class="meth-dimensions">${rows}</div>
                </div>`;
        }

        if (data.steps) {
            const rows = data.steps.map(s => `
                <div class="meth-step-row">
                    <div class="meth-step-num">${s.step}</div>
                    <div class="meth-step-label">${s.label}</div>
                    <div class="meth-step-detail">${s.detail}</div>
                </div>`).join('');
            bodyHtml = `
                <div class="meth-method-section">
                    <div class="meth-method-section-label">HOW WE CALCULATE IT</div>
                    <div class="meth-steps">${rows}</div>
                </div>`;
        }

        return `
            <div class="meth-method">
                <div class="meth-score-header">
                    <span class="meth-score-title">${data.name}</span>
                    <span class="meth-coverage-badge ${badgeClass}" style="font-size:10px;padding:3px 8px;border-radius:2px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;">${badgeLabel}</span>
                </div>
                <p class="meth-method-desc">${data.desc}</p>
                ${notScoredBlock}
                ${bodyHtml}
            </div>`;
    }

    function renderScore(score, market) {
        if (score.notscored) {
            return `
                <div class="meth-score">
                    <div class="meth-score-header">
                        <span class="meth-score-title">${score.name}</span>
                        <span class="meth-coverage-badge notscored" style="font-size:10px;padding:3px 8px;border-radius:2px;background:#f0efee;color:#999;font-weight:700;letter-spacing:.04em;text-transform:uppercase;">NOT SCORED · 0 OF 3 INPUTS</span>
                        <div class="meth-score-value-wrap"><span class="meth-score-value-notscored">Not scored</span></div>
                    </div>
                    <p class="meth-score-desc">${score.desc}</p>
                    <div class="meth-notscored-block">
                        <div class="meth-notscored-icon">○</div>
                        <div class="meth-notscored-text">
                            <strong>Held back rather than guessed.</strong> Below the 60% coverage gate, so we don't publish a number that isn't grounded.
                            <span class="meth-notscored-unlock">Unlocks when:</span> ${score.unlock}
                        </div>
                    </div>
                </div>
            `;
        }

        const badgeLabel = score.state === 'full' ? 'FULL' : `PARTIAL · ${score.rows.filter(r => !r.struck).length} OF ${score.rows.length} INPUTS`;
        const badgeClass = score.state === 'full' ? 'b-full' : 'b-part';

        let lastPillar = null;
        const bodyRows = score.rows.map(row => {
            const inputCell = `<td>
                <span class="meth-input-dot" style="background:${row.color}"></span><span class="meth-input-name">${row.input}</span>
                ${row.source ? `<div class="meth-input-source">${row.source}</div>` : ''}
            </td>`;

            let pillarHeader = '';
            if (row.pillar && row.pillar !== lastPillar) {
                lastPillar = row.pillar;
                pillarHeader = `<tr class="pillar-header"><td colspan="5">${row.pillar}</td></tr>`;
            }

            if (row.struck) {
                return pillarHeader + `
                    <tr class="gone">
                        ${inputCell}
                        <td>${row.wynd}</td>
                        <td class="r"><span class="miss">NO DATA</span></td>
                        <td class="r">${row.weight}</td>
                        <td class="r">—</td>
                    </tr>`;
            }
            return pillarHeader + `
                <tr>
                    ${inputCell}
                    <td>${row.wynd}</td>
                    <td class="r">${row.score}</td>
                    <td class="r">${row.weight}</td>
                    <td class="r"><strong>${row.contribution}</strong></td>
                </tr>`;
        }).join('');

        const rescaleRow = score.rescale ? `
            <tr class="rescale">
                <td colspan="3">${score.rescale.note}</td>
                <td class="r">${score.rescale.calc}</td>
                <td class="r">${score.rescale.result}</td>
            </tr>` : '';

        const confidenceHtml = score.confidence ? `
            <div class="meth-confidence">
                <span class="meth-confidence-badge"><span class="d"></span>${score.confidence.level}</span>
                <span class="meth-confidence-note">${score.confidence.note}</span>
            </div>` : '';

        return `
            <div class="meth-score">
                <div class="meth-score-header">
                    <span class="meth-score-title">${score.name}</span>
                    <span class="meth-coverage-badge ${badgeClass}" style="font-size:10px;padding:3px 8px;border-radius:2px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;">${badgeLabel}</span>
                    <div class="meth-score-value-wrap">
                        <span class="meth-score-value">${score.value ?? '—'}</span>
                        <span class="meth-score-unit">${score.unit}</span>
                    </div>
                </div>
                <p class="meth-score-desc">${score.desc}</p>
                ${score.why ? `<p class="meth-score-why">${score.why}</p>` : ''}
                <div class="meth-formula">
                    <div class="meth-formula-eyebrow">THE METHOD — SAME FOR EVERY MARKET</div>
                    <div class="meth-formula-text">${score.formula}</div>
                </div>
                <div class="meth-worked-label">WORKED EXAMPLE · WYNDHAM</div>
                <div class="meth-worked-example">
                    <table>
                        <thead>
                            <tr>
                                <td>INPUT</td>
                                <td>WYNDHAM'S VALUE</td>
                                <td class="r">SCORE</td>
                                <td class="r">× WEIGHT</td>
                                <td class="r">= CONTRIBUTION</td>
                            </tr>
                        </thead>
                        <tbody>
                            ${bodyRows}
                            ${rescaleRow}
                            <tr class="total">
                                <td class="label" colspan="3">WEIGHTED TOTAL</td>
                                <td></td>
                                <td class="r">${score.total} → ${score.finalScore}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                ${confidenceHtml}
            </div>
        `;
    }

    function switchMeasure(measureId) {
        // Hide all sections
        document.querySelectorAll('.meth-score-section').forEach(section => {
            section.classList.remove('active');
        });
        // Deactivate all coverage items
        document.querySelectorAll('.meth-coverage-item').forEach(item => {
            item.classList.remove('active');
        });
        // Show selected section
        const selectedSection = document.querySelector(`.meth-score-section[data-measure="${measureId}"]`);
        if (selectedSection) {
            selectedSection.classList.add('active');
        }
        // Activate selected coverage item
        const selectedItem = document.querySelector(`.meth-coverage-item[data-measure="${measureId}"]`);
        if (selectedItem) {
            selectedItem.classList.add('active');
        }
    }

    window.switchMeasure = switchMeasure;

    render();
</script>

</body>
</html>
